name: neus-dtu-ASG-SG-ada-fus-${dataset.scene}
tag: ""
seed: 42

dataset:
  name: dtu
  scene: ???
  root_dir: ./load/DTU/${dataset.scene}/
  cameras_file: cameras_sphere.npz
  img_downscale: 2 # specify training image size by either img_wh or img_downscale
  n_test_traj_steps: 60
  apply_mask: true

model:
  name: neus
  radius: 1.0
  num_samples_per_ray: 1024
  train_num_rays: 512
  max_train_num_rays: 2048
  grid_prune: false
  grid_prune_occ_thre: 0.001
  dynamic_ray_sampling: true
  batch_image_sampling: true
  randomized: true
  ray_chunk: 2048
  cos_anneal_end: 20000
  learned_background: false
  background_color: white
  variance:
    init_val: 0.3
    modulate: false
  geometry:
    name: volume-sdf-laplace-fusion
    radius: ${model.radius}
    feature_dim: 13
    sdf2weight: hf_neus
    grad_type: analytic
    finite_difference_eps: progressive
    isosurface:
      method: mc
      resolution: 768
      chunk: 2097152
      threshold: 0.
    xyz_encoding_config:
      otype: ProgressiveBandHashGrid
      n_levels: 10
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 32
      per_level_scale: 1.3195079107728942
      include_xyz: true
      start_level: 4
      start_step: 5000
      update_steps: 1000
    xyz_encoding_config_f:
      otype: ProgressiveBandHashGrid
      n_levels: 16
      n_features_per_level: 2
      log2_hashmap_size: 19
      base_resolution: 32
      per_level_scale: 1.3195079107728942
      include_xyz: true
      start_level: 10
      start_step: 5000
      update_steps: 1000
    mlp_network_config:
      otype: VanillaMLP
      activation: ReLU
      output_activation: none
      n_neurons: 64
      n_hidden_layers: 2
      sphere_init: true
      sphere_init_radius: 0.5
      weight_norm: true
    weight_network_config:
      otype: VanillaMLP
      activation: ReLU
      output_activation: sigmoid
      n_neurons: 64
      n_hidden_layers: 1
  texture:
    name: volume-radiance-ASG
    input_feature_dim: ${add:${model.geometry.feature_dim},6} # surface normal as additional input
    dir_encoding_config:
      otype: SphericalHarmonics
      degree: 4
    mlp_network_config:
      otype: VanillaMLP
      activation: ReLU
      output_activation: none
      n_neurons: 64
      n_hidden_layers: 2
    ASG_network_config:
      otype: VanillaMLP
      activation: ReLU
      output_activation: none
      n_neurons: 64
      n_hidden_layers: 2
    weight_network_config:
      otype: VanillaMLP
      activation: ReLU
      output_activation: sigmoid
      n_neurons: 64
      n_hidden_layers: 1
    color_activation: sigmoid

system:
  name: neus-system
  loss:
    lambda_rgb_mse: 0.
    lambda_rgb_l1: 1.
    lambda_mask: 0.1
    lambda_eikonal: 0.1
    lambda_curvature: 5e-4
    curvature_warmup_steps: 5000
    lambda_sparsity: 0.
    sparsity_scale: 1.
    lambda_distortion: 0.
    lambda_orientation: 0.
    lambda_adaptive: 0.
    lambda_opaque: 0.
    lambda_entropy: 0.
    lambda_surface_bias: 0.
  optimizer:
    name: AdamW
    args:
      lr: 0.01
      betas: [0.9, 0.99]
      eps: 1.e-15
    params:
      geometry:
        lr: 0.01
      texture:
        lr: 0.01
      variance:
        lr: 0.001
  warmup_steps: 500
  scheduler:
    name: SequentialLR
    interval: step
    milestones:
      - ${system.warmup_steps}
    schedulers:
      - name: LinearLR # linear warm-up in the first system.warmup_steps steps
        args:
          start_factor: 0.01
          end_factor: 1.0
          total_iters: ${system.warmup_steps}
      - name: ExponentialLR
        args:
          gamma: ${calc_exp_lr_decay_rate:0.1,${sub:${trainer.max_steps},${system.warmup_steps}}}

checkpoint:
  save_top_k: -1
  every_n_train_steps: ${trainer.max_steps}

export:
  chunk_size: 2097152
  export_vertex_color: True

trainer:
  max_steps: 80000
  log_every_n_steps: 100
  num_sanity_val_steps: 0
  val_check_interval: 5000
  limit_train_batches: 1.0
  limit_val_batches: 1
  enable_progress_bar: true
  precision: 16
